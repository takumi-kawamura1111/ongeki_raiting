<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>オンゲキ レート管理</title>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./favicon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#0a0d14',
              card: '#121824',
              border: '#1e293b',
              accent: '#00f0ff',
              pink: '#ff2a85',
              gold: '#ffb700'
            }
          },
          boxShadow: {
            'neon-cyan': '0 0 15px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.2)',
            'neon-pink': '0 0 15px rgba(255, 42, 133, 0.4), 0 0 30px rgba(255, 42, 133, 0.2)',
            'neon-gold': '0 0 15px rgba(255, 183, 0, 0.4), 0 0 30px rgba(255, 183, 0, 0.2)',
          }
        }
      }
    }
  </script>

  <!-- FontAwesome & PyScript -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.10.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.10.1/core.js"></script>

  <style>
    body {
      background-color: #080b11;
      background-image:
        radial-gradient(at 0% 0%, rgba(0, 240, 255, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(255, 42, 133, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(18, 24, 36, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-btn.active { color: #00f0ff; }
    .nav-btn.active i { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.7)); }
    .chip.active { background: rgba(0, 240, 255, 0.15); border-color: rgba(0, 240, 255, 0.6); color: #67e8f9; }
    .jacket-card { -webkit-tap-highlight-color: transparent; }
    .jacket-card:active { transform: scale(0.97); }
    #toast { transition: opacity .3s, transform .3s; }
  </style>
</head>
<body class="text-slate-100 min-h-screen font-sans">

  <!-- ローディング -->
  <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-3 bg-[#080b11]">
    <i class="fa-solid fa-compact-disc fa-spin text-4xl text-cyan-400"></i>
    <div id="loader-msg" class="text-sm text-slate-400">起動中…</div>
  </div>

  <!-- ヘッダー：総合レート -->
  <header class="sticky top-0 z-30 glass-card border-x-0 border-t-0 px-4 pt-3 pb-2">
    <div class="max-w-md mx-auto">
      <div class="flex items-end justify-between">
        <div>
          <div class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Rating</div>
          <div id="total-rating" class="text-4xl font-black font-mono tracking-tight bg-gradient-to-r from-white via-slate-100 to-cyan-300 bg-clip-text text-transparent drop-shadow-[0_0_15px_rgba(0,240,255,0.4)]">—</div>
        </div>
        <div id="total-breakdown" class="grid grid-cols-3 gap-1.5 text-center text-[10px]"></div>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 pb-28">

    <!-- 枠タブ -->
    <section id="tab-frames" class="tab-page space-y-3">
      <div class="grid grid-cols-[1fr_1fr_1fr_auto] gap-2">
        <button class="chip frame-chip active text-xs font-bold py-2 rounded-xl border border-slate-700 bg-slate-900/60" data-frame="best">ベスト枠</button>
        <button class="chip frame-chip text-xs font-bold py-2 rounded-xl border border-slate-700 bg-slate-900/60" data-frame="new">新曲枠</button>
        <button class="chip frame-chip text-xs font-bold py-2 rounded-xl border border-slate-700 bg-slate-900/60" data-frame="plat">P枠</button>
        <button id="display-open" class="px-3 rounded-xl border border-cyan-400/50 bg-cyan-500/10 text-cyan-300" aria-label="表示モード">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
      <div id="frame-info" class="text-[11px] text-slate-400 flex justify-between px-1"></div>
      <div id="frame-grid" class="grid grid-cols-3 gap-2"></div>
    </section>

    <!-- 検索タブ -->
    <section id="tab-search" class="tab-page hidden space-y-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
        <input id="search-q" type="search" placeholder="曲名・アーティスト"
          class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pl-10 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
      </div>
      <div class="flex gap-1.5 overflow-x-auto">
        <button class="chip diff-chip active text-[11px] font-bold px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60" data-diff="ALL">ALL</button>
        <button class="chip diff-chip text-[11px] font-bold px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60 text-red-400" data-diff="EXP">EXP</button>
        <button class="chip diff-chip text-[11px] font-bold px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60 text-fuchsia-400" data-diff="MAS">MAS</button>
        <button class="chip diff-chip text-[11px] font-bold px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-200" data-diff="LUN">LUN</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <label class="text-[11px] text-slate-400">定数
          <div class="flex items-center gap-1 mt-1">
            <input id="const-min" type="number" step="0.1" inputmode="decimal" placeholder="下限" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-lg px-2 py-1.5 text-white font-mono text-sm focus:outline-none focus:border-cyan-400">
            <span>〜</span>
            <input id="const-max" type="number" step="0.1" inputmode="decimal" placeholder="上限" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-lg px-2 py-1.5 text-white font-mono text-sm focus:outline-none focus:border-cyan-400">
          </div>
        </label>
        <label class="text-[11px] text-slate-400">並び順
          <select id="search-sort" class="w-full mt-1 bg-slate-900/80 border border-slate-700/80 rounded-lg px-2 py-1.5 text-white text-sm focus:outline-none focus:border-cyan-400">
            <option value="const">定数が高い順</option>
            <option value="new">新しい順</option>
          </select>
        </label>
      </div>
      <div id="search-info" class="text-[11px] text-slate-500 px-1"></div>
      <div id="search-grid" class="grid grid-cols-6 gap-1"></div>
    </section>

    <!-- 入力タブ -->
    <section id="tab-input" class="tab-page hidden">
      <div id="editor-empty" class="glass-card rounded-2xl p-8 text-center text-slate-400 space-y-3">
        <i class="fa-solid fa-compact-disc text-4xl text-slate-600"></i>
        <p class="text-sm">検索タブから楽曲を選んでください</p>
        <button class="nav-jump text-xs font-bold px-4 py-2 rounded-xl bg-cyan-500/20 border border-cyan-400/50 text-cyan-300" data-tab="search">
          <i class="fa-solid fa-magnifying-glass mr-1"></i>楽曲を探す
        </button>
      </div>

      <div id="editor" class="hidden space-y-3">
        <div class="glass-card rounded-2xl overflow-hidden relative">
          <img id="ed-jacket-bg" class="absolute inset-0 w-full h-full object-cover blur-2xl opacity-30 scale-110" alt="">
          <div class="relative flex gap-3 p-2.5">
            <img id="ed-jacket" class="w-20 h-20 rounded-xl object-cover shadow-2xl bg-slate-800 shrink-0" alt="">
            <div class="min-w-0 flex flex-col justify-between py-0.5">
              <div>
                <div id="ed-title" class="font-bold leading-tight line-clamp-2"></div>
                <div id="ed-artist" class="text-[11px] text-slate-300 truncate mt-0.5"></div>
              </div>
              <div id="ed-meta" class="flex flex-wrap items-center gap-1.5 text-[11px]"></div>
            </div>
          </div>
          <div id="ed-diffs" class="relative grid grid-cols-5 gap-1 px-2.5 pb-2.5"></div>
        </div>

        <div class="glass-card rounded-2xl p-3 space-y-3">
          <!-- スコア -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label for="ed-score" class="text-xs font-medium text-slate-300">
                <i class="fa-solid fa-trophy text-pink-400 mr-1.5"></i>テクニカルスコア
              </label>
              <div class="flex gap-1">
                <button class="quick-score text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded transition-colors" data-score="1010000">理論値</button>
                <button class="quick-score text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded transition-colors" data-score="1007500">SSS+</button>
                <button class="quick-score text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded transition-colors" data-score="1000000">SSS</button>
              </div>
            </div>
            <input type="number" id="ed-score" inputmode="numeric" placeholder="1005500"
              class="ed-input w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-lg placeholder-slate-600 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 font-mono transition-all">
          </div>

          <!-- ランプ -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">
              <i class="fa-solid fa-award text-amber-400 mr-1.5"></i>ランプボーナス
            </label>
            <div id="ed-lamps" class="grid grid-cols-6 gap-1"></div>
          </div>

          <!-- プラチナ★ -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">
              <i class="fa-solid fa-star text-yellow-300 mr-1.5"></i>プラチナスコア ★
            </label>
            <div id="ed-stars" class="grid grid-cols-7 gap-1"></div>
          </div>

          <div id="error-msg" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded-lg p-2.5 text-center"></div>
        </div>

        <!-- プレビュー＋保存（下部タブの直上に固定） -->
        <div class="sticky z-20 bottom-[calc(env(safe-area-inset-bottom)+66px)] glass-card rounded-2xl p-2 space-y-2 shadow-2xl">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div>
              <div class="text-slate-500 text-[10px]">単曲値</div>
              <div id="pv-single" class="font-mono font-bold text-cyan-300">—</div>
            </div>
            <div>
              <div class="text-slate-500 text-[10px]">P枠値</div>
              <div id="pv-plat" class="font-mono font-bold text-yellow-300">—</div>
            </div>
            <div>
              <div class="text-slate-500 text-[10px]">総合レート</div>
              <div id="pv-total" class="font-mono font-bold text-white leading-tight">—</div>
            </div>
          </div>
          <div class="flex gap-2">
            <button id="ed-delete" class="px-4 py-2.5 rounded-xl text-rose-400 bg-rose-500/10 border border-rose-500/30">
              <i class="fa-solid fa-trash"></i>
            </button>
            <button id="ed-save" class="flex-1 py-2.5 rounded-xl font-bold text-slate-900 bg-gradient-to-r from-cyan-400 via-cyan-300 to-pink-400 active:scale-[0.99] transition-all shadow-neon-cyan">
              <i class="fa-solid fa-floppy-disk mr-1"></i>保存
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 設定タブ -->
    <section id="tab-settings" class="tab-page hidden space-y-4">
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <h2 class="text-sm font-bold"><i class="fa-solid fa-bolt text-cyan-400 mr-1.5"></i>新曲枠の対象バージョン</h2>
        <div id="version-list" class="grid grid-cols-2 gap-1.5"></div>
      </div>

      <div class="glass-card rounded-2xl p-4 space-y-3">
        <h2 class="text-sm font-bold"><i class="fa-solid fa-database text-pink-400 mr-1.5"></i>データ管理</h2>
        <div id="record-count" class="text-xs text-slate-400"></div>
        <div class="grid grid-cols-2 gap-2">
          <button id="export-btn" class="py-2.5 rounded-xl text-xs font-bold bg-slate-900/60 border border-slate-700">
            <i class="fa-solid fa-download mr-1"></i>書き出し
          </button>
          <label class="py-2.5 rounded-xl text-xs font-bold bg-slate-900/60 border border-slate-700 text-center cursor-pointer">
            <i class="fa-solid fa-upload mr-1"></i>読み込み
            <input id="import-file" type="file" accept="application/json,.json" class="hidden">
          </label>
          <button id="copy-btn" class="py-2.5 rounded-xl text-xs font-bold bg-slate-900/60 border border-slate-700">
            <i class="fa-solid fa-copy mr-1"></i>コピー
          </button>
          <button id="paste-btn" class="py-2.5 rounded-xl text-xs font-bold bg-slate-900/60 border border-slate-700">
            <i class="fa-solid fa-paste mr-1"></i>貼り付けて読み込み
          </button>
        </div>
        <button id="clear-btn" class="w-full py-2.5 rounded-xl text-xs font-bold text-rose-400 bg-rose-500/10 border border-rose-500/30">
          <i class="fa-solid fa-trash mr-1"></i>全記録を削除
        </button>
      </div>

      <div class="text-[11px] text-slate-500 leading-relaxed px-1">
        記録はこのブラウザ内にのみ保存されます。
      </div>
    </section>

  </main>

  <!-- 表示モード：レートと枠内の楽曲のみを1画面に表示 -->
  <div id="display" class="hidden fixed inset-0 z-40 flex flex-col bg-[#080b11]
    pb-[max(env(safe-area-inset-bottom),8px)] px-1">
    <!-- 上部の数値は通常画面のヘッダーと同じ色の帯にする -->
    <div class="glass-card border-x-0 border-t-0 -mx-1 px-2 pt-[max(env(safe-area-inset-top),8px)] pb-2 mb-1.5">
    <!-- 通常画面のヘッダーと同じレイアウト -->
    <div class="relative flex items-end justify-between">
      <div>
        <div class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Rating</div>
        <div id="display-rating" class="text-4xl font-black font-mono tracking-tight bg-gradient-to-r from-white via-slate-100 to-cyan-300 bg-clip-text text-transparent drop-shadow-[0_0_15px_rgba(0,240,255,0.4)]"></div>
      </div>
      <div id="display-frame" class="grid grid-cols-3 gap-1.5 text-center text-[10px] cursor-pointer"></div>
      <button id="display-close" class="absolute -top-1 right-0 text-slate-500 text-base leading-none p-1" aria-label="閉じる">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    </div>
    <div id="display-wrap" class="flex-1 min-h-0 flex items-center justify-center">
      <div id="display-grid" class="grid gap-1 w-full"></div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-40 px-4 py-2 rounded-full text-xs font-bold bg-cyan-500/90 text-slate-900 opacity-0 pointer-events-none translate-y-2"></div>

  <!-- 下部タブ -->
  <nav class="fixed bottom-0 inset-x-0 z-30 glass-card border-x-0 border-b-0 pb-[env(safe-area-inset-bottom)]">
    <div class="max-w-md mx-auto grid grid-cols-4">
      <button class="nav-btn active flex flex-col items-center gap-1 py-2.5 text-slate-400" data-tab="frames">
        <i class="fa-solid fa-table-cells-large text-lg"></i><span class="text-[10px] font-bold">枠</span>
      </button>
      <button class="nav-btn flex flex-col items-center gap-1 py-2.5 text-slate-400" data-tab="search">
        <i class="fa-solid fa-magnifying-glass text-lg"></i><span class="text-[10px] font-bold">検索</span>
      </button>
      <button class="nav-btn flex flex-col items-center gap-1 py-2.5 text-slate-400" data-tab="input">
        <i class="fa-solid fa-pen-to-square text-lg"></i><span class="text-[10px] font-bold">入力</span>
      </button>
      <button class="nav-btn flex flex-col items-center gap-1 py-2.5 text-slate-400" data-tab="settings">
        <i class="fa-solid fa-gear text-lg"></i><span class="text-[10px] font-bold">設定</span>
      </button>
    </div>
  </nav>

  <!-- main.py 読み込み -->
  <script type="py" src="./main.py" config='{"files": {"./rating.py": ""}}'></script>

</body>
</html>
